name: GhostDesk verification
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/ghostdesk/**"
      - "packages/**"
      - "tests/**"
      - "e2e/**"
      - "tsconfig.json"
      - "scripts/**"
      - "package*.json"
      - "*.config.ts"
      - "apps/api/**"
      - "db/**"
      - "Dockerfile"
      - ".github/workflows/**"
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify decoded evidence recordings and first-frame posters
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 scripts/verify-recordings.py
      - run: npm run build
      - run: npm run standalone
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -s apps/api/maven-settings.xml -f apps/api/pom.xml verify
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - run: npm run test:e2e:install
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ghostdesk-browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
