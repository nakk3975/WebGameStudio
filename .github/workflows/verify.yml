name: GhostDesk verification
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/ghostdesk/**"
      - "packages/**"
      - "tests/**"
      - "package*.json"
      - "*.config.ts"
      - "apps/api/**"
      - "db/**"
      - "Dockerfile"
      - ".github/workflows/**"
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run standalone
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -s apps/api/maven-settings.xml -f apps/api/pom.xml verify
